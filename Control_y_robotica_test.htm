function ShowElements(Show, TagName, ContainerToReverse){
// added third argument to allow objects in the feedback box to appear
//IE bug -- hide all the form elements that will show through the popup
//FF on Mac bug : doesn't redisplay objects whose visibility is set to visible
//unless the object's display property is changed

	//get container object (by Id passed in, or use document otherwise)
	TopNode = document.getElementById(ContainerToReverse);
	var Els;
	if (TopNode != null) {
		Els = TopNode.getElementsByTagName(TagName);
	} else {
		Els = document.getElementsByTagName(TagName);
	}

	for (var i=0; i<Els.length; i++){
		if (TagName == "object") {
			//manipulate object elements in all browsers
			if (Show == true){
				Els[i].style.visibility = 'visible';
			}
			else{
				Els[i].style.visibility = 'hidden';
			}
		} 
	}
}

//PAGE DIMENSION FUNCTIONS
function PageDim(){
//Get the page width and height
	this.W = 600;
	this.H = 400;
	this.W = document.getElementsByTagName('body')[0].offsetWidth;
	this.H = document.getElementsByTagName('body')[0].offsetHeight;
}

var pg = null;

function GetPageXY(El) {
	var XY = {x: 0, y: 0};
	while(El){
		XY.x += El.offsetLeft;
		XY.y += El.offsetTop;
		El = El.offsetParent;
	}
	return XY;
}

function GetScrollTop(){
	if (typeof(window.pageYOffset) == 'number'){
		return window.pageYOffset;
	}
	else{
		if ((document.body)&&(document.body.scrollTop)){
			return document.body.scrollTop;
		}
		else{
			if ((document.documentElement)&&(document.documentElement.scrollTop)){
				return document.documentElement.scrollTop;
			}
			else{
				return 0;
			}
		}
	}
}

function GetViewportHeight(){
	if (typeof window.innerHeight != 'undefined'){
		return window.innerHeight;
	}
	else{
		if (((typeof document.documentElement != 'undefined')&&(typeof document.documentElement.clientHeight !=
     'undefined'))&&(document.documentElement.clientHeight != 0)){
			return document.documentElement.clientHeight;
		}
		else{
			return document.getElementsByTagName('body')[0].clientHeight;
		}
	}
}

function TopSettingWithScrollOffset(TopPercent){
	var T = Math.floor(GetViewportHeight() * (TopPercent/100));
	return GetScrollTop() + T; 
}

//CODE FOR AVOIDING LOSS OF DATA WHEN BACKSPACE KEY INVOKES history.back()
var InTextBox = false;

function SuppressBackspace(e){ 
	if (InTextBox == true){return;}
	thisKey = e.keyCode;

	var Suppress = false;

	if (thisKey == 8) {
		Suppress = true;
		e.preventDefault();
	}
}

window.addEventListener('keypress',SuppressBackspace,false);

function ReduceItems(InArray, ReduceToSize){
	var ItemToDump=0;
	var j=0;
	while (InArray.length > ReduceToSize){
		ItemToDump = Math.floor(InArray.length*Math.random());
		InArray.splice(ItemToDump, 1);
	}
}

function Shuffle(InArray){
	var Num;
	var Temp = new Array();
	var Len = InArray.length;

	var j = Len;

	for (var i=0; i<Len; i++){
		Temp[i] = InArray[i];
	}

	for (i=0; i<Len; i++){
		Num = Math.floor(j  *  Math.random());
		InArray[i] = Temp[Num];

		for (var k=Num; k < (j-1); k++) {
			Temp[k] = Temp[k+1];
		}
		j--;
	}
	return InArray;
}

function EscapeDoubleQuotes(InString){
	return InString.replace(/"/g, '&quot;')
}

function TrimString(InString){
        var x = 0;

        if (InString.length != 0) {
                while ((InString.charAt(InString.length - 1) == '\u0020') || (InString.charAt(InString.length - 1) == '\u000A') || (InString.charAt(InString.length - 1) == '\u000D')){
                        InString = InString.substring(0, InString.length - 1)
                }

                while ((InString.charAt(0) == '\u0020') || (InString.charAt(0) == '\u000A') || (InString.charAt(0) == '\u000D')){
                        InString = InString.substring(1, InString.length)
                }

                while (InString.indexOf('  ') != -1) {
                        x = InString.indexOf('  ')
                        InString = InString.substring(0, x) + InString.substring(x+1, InString.length)
                 }

                return InString;
        }

        else {
                return '';
        }
}

function FindLongest(InArray){
	if (InArray.length < 1){return -1;}

	var Longest = 0;
	for (var i=1; i<InArray.length; i++){
		if (InArray[i].length > InArray[Longest].length){
			Longest = i;
		}
	}
	return Longest;
}

//SELECTION OBJECT FOR TYPING WITH KEYPAD
var selObj = null;
            
SelObj = function(box){
	this.box = box;
	this.selStart = this.box.selectionStart;
	this.selEnd = this.box.selectionEnd;
	this.selText = this.box.value.substring(this.selStart, this.selEnd);
	return this;
}

function setSelText(newText){
	var caretPos = this.selStart + newText.length;
	var newValue = this.box.value.substring(0, this.selStart);
	newValue += newText;
	newValue += this.box.value.substring(this.selEnd, this.box.value.length);
	this.box.value = newValue;
	this.box.setSelectionRange(caretPos, caretPos);
	this.box.focus();
}
SelObj.prototype.setSelText = setSelText;

function setSelSelectionRange(start, end){
	this.box.setSelectionRange(start, end);
}
SelObj.prototype.setSelSelectionRange = setSelSelectionRange;

		QList.push(Qs.removeChild(Qs.getElementsByTagName('li')[0]));
	}
	var DumpItem = 0;
	if (QsToShow > QList.length){
		QsToShow = QList.length;
	}
	while (QsToShow < QList.length){
		DumpItem = Math.floor(QList.length*Math.random());
		for (j=DumpItem; j<(QList.length-1); j++){
			QList[j] = QList[j+1];
		}
		QList.length = QList.length-1;
	}
	if (ShuffleQs == true){
		QList = Shuffle(QList);
	}
	if (ShuffleAs == true){
		var As;
		for (var i=0; i<QList.length; i++){
			As = QList[i].getElementsByTagName('ol')[0];
			if (As != null){
  			AList.length = 0;
				while (As.getElementsByTagName('li').length > 0){
					AList.push(As.removeChild(As.getElementsByTagName('li')[0]));
				}
				AList = Shuffle(AList);
				for (j=0; j<AList.length; j++){
					As.appendChild(AList[j]);
				}
			}
		}
	}
	
	for (i=0; i<QList.length; i++){
		Qs.appendChild(QList[i]);
		QArray[QArray.length] = QList[i];
	}

//Show the first item
	QArray[0].style.display = '';
	
//Now hide all except the first item
	for (i=1; i<QArray.length; i++){
		QArray[i].style.display = 'none';
	}		
	SetQNumReadout();
	
	SetFocusToTextbox();
}

function SetFocusToTextbox(){
//if there's a textbox, set the focus in it
	if (QArray[CurrQNum].getElementsByTagName('input')[0] != null){
		QArray[CurrQNum].getElementsByTagName('input')[0].focus();
//and show a keypad if there is one
		if (document.getElementById('CharacterKeypad') != null){
			document.getElementById('CharacterKeypad').style.display = 'block';
		}
	}
	else{
  	if (QArray[CurrQNum].getElementsByTagName('textarea')[0] != null){
  		QArray[CurrQNum].getElementsByTagName('textarea')[0].focus();	
//and show a keypad if there is one
			if (document.getElementById('CharacterKeypad') != null){
				document.getElementById('CharacterKeypad').style.display = 'block';
			}
		}
//This added for 6.0.4.11: hide accented character buttons if no textbox
		else{
			if (document.getElementById('CharacterKeypad') != null){
				document.getElementById('CharacterKeypad').style.display = 'none';
			}
		}
	}
}

function ChangeQ(ChangeBy){
//The following line prevents moving to another question until the current
//question is answered correctly. Uncomment it to enable this behaviour. 
//	if (State[CurrQNum][0] == -1){return;}
	if (((CurrQNum + ChangeBy) < 0)||((CurrQNum + ChangeBy) >= QArray.length)){return;}
	QArray[CurrQNum].style.display = 'none';
	CurrQNum += ChangeBy;
	QArray[CurrQNum].style.display = '';
//Undocumented function added 10/12/2004
	ShowSpecialReadingForQuestion();
	SetQNumReadout();
	SetFocusToTextbox();
}

var HiddenReadingShown = false;
function ShowSpecialReadingForQuestion(){
//Undocumented function for showing specific reading text elements which change with each question
//Added on 10/12/2004
	if (document.getElementById('ReadingDiv') != null){
		if (HiddenReadingShown == true){
			document.getElementById('ReadingDiv').innerHTML = '';
		}
		if (QArray[CurrQNum] != null){
//Fix for 6.0.4.25
			var Children = QArray[CurrQNum].getElementsByTagName('div');
			for (var i=0; i<Children.length; i++){
			if (Children[i].className=="HiddenReading"){
					document.getElementById('ReadingDiv').innerHTML = Children[i].innerHTML;
					HiddenReadingShown = true;
//Hide the ShowAllQuestions button to avoid confusion
					if (document.getElementById('ShowMethodButton') != null){
						document.getElementById('ShowMethodButton').style.display = 'none';
					}
				}
			}	
		}
	}
}

function SetQNumReadout(){
	document.getElementById('QNumReadout').innerHTML = (CurrQNum+1) + ' / ' + QArray.length;
	if ((CurrQNum+1) >= QArray.length){
		if (document.getElementById('NextQButton') != null){
			document.getElementById('NextQButton').style.visibility = 'hidden';
		}
	}
	else{
		if (document.getElementById('NextQButton') != null){
			document.getElementById('NextQButton').style.visibility = 'visible';
		}
	}
	if (CurrQNum <= 0){
		if (document.getElementById('PrevQButton') != null){
			document.getElementById('PrevQButton').style.visibility = 'hidden';
		}
	}
	else{
		if (document.getElementById('PrevQButton') != null){
			document.getElementById('PrevQButton').style.visibility = 'visible';
		}
	}
}

var I=new Array();


function StartUp(){

//If there's only one question, no need for question navigation controls
	if (QsToShow < 2){
		document.getElementById('QNav').style.display = 'none';
	}
	
//Stash the instructions so they can be redisplayed
	strInstructions = document.getElementById('InstructionsDiv').innerHTML;
	

	

	

	
	CompleteEmptyFeedback();

	SetUpQuestions();
	ClearTextBoxes();
	CreateStatusArray();
	

	
//Check search string for q parameter
	if (document.location.search.length > 0){
		if (ShuffleQs == false){
			var JumpTo = parseInt(document.location.search.substring(1,document.location.search.length))-1;
			if (JumpTo <= QsToShow){
				ChangeQ(JumpTo);
			}
		}
	}
//Undocumented function added 10/12/2004
	ShowSpecialReadingForQuestion();
}

function ShowHideQuestions(){
	document.getElementById('ShowMethodButton').style.display = 'none';
	if (ShowingAllQuestions == false){
		for (var i=0; i<QArray.length; i++){
				QArray[i].style.display = '';
			}
		document.getElementById('Questions').style.listStyleType = 'decimal';
		document.getElementById('OneByOneReadout').style.display = 'none';
		document.getElementById('ShowMethodButton').innerHTML = ShowOneByOneCaption;
		ShowingAllQuestions = true;
	}
	else{
		for (var i=0; i<QArray.length; i++){
				if (i != CurrQNum){
					QArray[i].style.display = 'none';
				}
			}
		document.getElementById('Questions').style.listStyleType = 'none';
		document.getElementById('OneByOneReadout').style.display = '';
		document.getElementById('ShowMethodButton').innerHTML = ShowAllQuestionsCaption;
		ShowingAllQuestions = false;	
	}
	document.getElementById('ShowMethodButton').style.display = 'inline';
}

function CreateStatusArray(){
	var QNum, ANum;
//For each item in the item array
	for (QNum=0; QNum<I.length; QNum++){
//Check if the question still exists (hasn't been nuked by showing a random selection)
		if (document.getElementById('Q_' + QNum) != null){
			State[QNum] = new Array();
			State[QNum][0] = -1; //Score for this q; -1 shows question not done yet
			State[QNum][1] = new Array(); //answers
			for (ANum = 0; ANum<I[QNum][3].length; ANum++){
				State[QNum][1][ANum] = 0; //answer not chosen yet; when chosen, will store its position in the series of choices
			}
			State[QNum][2] = 0; //tries at this q so far
			State[QNum][3] = 0; //incrementing percent-correct values of selected answers
			State[QNum][4] = 0; //penalties incurred for hints
			State[QNum][5] = ''; //Sequence of answers chosen by number
		}
		else{
			State[QNum] = null;
		}
	}
}





function CalculateOverallScore(){
	var TotalWeighting = 0;
	var TotalScore = 0;
	
	for (var QNum=0; QNum<State.length; QNum++){
		if (State[QNum] != null){
			if (State[QNum][0] > -1){
				TotalWeighting += I[QNum][0];
				TotalScore += (I[QNum][0] * State[QNum][0]);
			}
		}
	}
	if (TotalWeighting > 0){
		Score = Math.floor((TotalScore/TotalWeighting)*100);
	}
	else{
//if TotalWeighting is 0, no questions so far have any value, so 
//no penalty should be shown.
		Score = 100; 
	}
}

//New for 6.2.2.0
function CheckQuestionsCompleted(){
	if (ShowCompletedSoFar == false){return '';}
	var QsCompleted = 0;
	for (var QNum=0; QNum<State.length; QNum++){
		if (State[QNum] != null){
			if (State[QNum][0] >= 0){
				QsCompleted++;
			}
		}
	}
//Fixes for 6.2.2.2
	if (QsCompleted >= QArray.length){
		return ExerciseCompleted;
	}
	else{
		return CompletedSoFar + ' ' + QsCompleted + '/' + QArray.length + '.';
	}
}

function CheckFinished(){
	var FB = '';
	var AllDone = true;
	for (var QNum=0; QNum<State.length; QNum++){
		if (State[QNum] != null){
			if (State[QNum][0] < 0){
				AllDone = false;
			}
		}
	}
	if (AllDone == true){
	
//Report final score and submit if necessary
		CalculateOverallScore();
		FB = YourScoreIs + ' ' + Score + '%.';
		if (ShowCorrectFirstTime == true){
			var CFT = 0;
			for (QNum=0; QNum<State.length; QNum++){
				if (State[QNum] != null){
					if (State[QNum][0] >= 1){
						CFT++;
					}
				}
			}
			FB += '<br />' + CorrectFirstTime + ' ' + CFT + '/' + QsToShow;
		}
		
//New for 6.2.2.0
		FB += '<br />' + ExerciseCompleted;
		
		WriteToInstructions(FB);
		
		Finished == true;




		TimeOver = true;
		Locked = true;
		


		Finished = true;
		Detail = '<?xml version="1.0"?><hpnetresult><fields>';
		for (QNum=0; QNum<State.length; QNum++){
			if (State[QNum] != null){
				if (State[QNum][5].length > 0){
					Detail += '<field><fieldname>Question #' + (QNum+1) + '</fieldname><fieldtype>question-tracking</fieldtype><fieldlabel>Q ' + (QNum+1) + '</fieldlabel><fieldlabelid>QuestionTrackingField</fieldlabelid><fielddata>' + State[QNum][5] + '</fielddata></field>';
				}
			}
		}
		Detail += '</fields></hpnetresult>';
	}

}










//-->

//]]>

</script>

<script id="hpk-js">
(function HPK_RUNTIME(CFG) {
  var enviado = false;
  var datos = null;
  var resultado = null;

  function limpiar(s) { return String(s || '').replace(/\s+/g, ' ').trim(); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function nombreValido(n) {
    return n.split(' ').filter(Boolean).length >= 2 && n.length >= 5 && /[A-Za-zÀ-ÿ]/.test(n);
  }
  function leer(k) { try { return sessionStorage.getItem('hpk_' + k) || ''; } catch (e) { return ''; } }
  function guardar(k, v) { try { sessionStorage.setItem('hpk_' + k, v); } catch (e) {} }
  function $(id) { return document.getElementById(id); }

  /* Hot Potatoes bloquea la tecla Retroceso salvo que InTextBox sea true */
  function enTexto(v) { try { window.InTextBox = v; } catch (e) {} }

  /* ---------- Ventana inicial de datos del equipo ---------- */
  function ventanaDatos(alAceptar) {
    var ov = document.createElement('div');
    ov.id = 'hpk-overlay';
    ov.setAttribute('role', 'dialog');
    ov.setAttribute('aria-modal', 'true');
    ov.setAttribute('aria-labelledby', 'hpk-titulo');
    ov.innerHTML = [
      '<div class="hpk-caja">',
      '<h2 id="hpk-titulo">Datos del equipo</h2>',
      '<p class="hpk-act">' + esc(CFG.actividad) + '</p>',
      '<p class="hpk-info">Escribe nombre y apellidos de los dos miembros del grupo. Sin estos datos no se puede empezar.</p>',
      '<div class="hpk-par">',
      '<div class="hpk-tarjeta"><h3>Alumno/a 1</h3>',
      '<label for="hpk-a1">Nombre y apellidos</label>',
      '<input type="text" id="hpk-a1" autocomplete="off" placeholder="Ej: Lucía Pérez Gómez"></div>',
      '<div class="hpk-tarjeta"><h3>Alumno/a 2</h3>',
      '<label for="hpk-a2">Nombre y apellidos</label>',
      '<input type="text" id="hpk-a2" autocomplete="off" placeholder="Ej: Marcos Díaz Ruiz"></div>',
      '</div>',
      '<label class="hpk-solo"><input type="checkbox" id="hpk-solo"> Trabajo en solitario (sin pareja)</label>',
      '<div class="hpk-grupo"><label for="hpk-curso">Nombre del profesor/a</label>',
      '<input type="text" id="hpk-curso" autocomplete="off" placeholder="Ej: Eduardo"></div>',
      '<div id="hpk-err" class="hpk-err" role="alert"></div>',
      '<button type="button" id="hpk-go" class="hpk-btn">Empezar la actividad</button>',
      '</div>'
    ].join('');
    document.body.appendChild(ov);

    $('hpk-a1').value = leer('a1');
    $('hpk-a2').value = leer('a2');
    $('hpk-curso').value = leer('curso');
    if (leer('solo') === '1') { $('hpk-solo').checked = true; }

    function alternarSolo() {
      var solo = $('hpk-solo').checked;
      $('hpk-a2').disabled = solo;
      if (solo) { $('hpk-a2').value = ''; }
    }
    alternarSolo();
    $('hpk-solo').addEventListener('change', alternarSolo);

    ov.addEventListener('focusin', function () { enTexto(true); });
    ov.addEventListener('focusout', function () { enTexto(false); });

    function validar() {
      var a1 = limpiar($('hpk-a1').value);
      var a2 = limpiar($('hpk-a2').value);
      var curso = limpiar($('hpk-curso').value);
      var solo = $('hpk-solo').checked;
      var m = [];
      if (!nombreValido(a1)) { m.push('Escribe nombre y apellidos del alumno/a 1.'); }
      if (!solo) {
        if (!nombreValido(a2)) { m.push('Escribe nombre y apellidos del alumno/a 2 (o marca «Trabajo en solitario»).'); }
        else if (a1.toLowerCase() === a2.toLowerCase()) { m.push('Los dos alumnos no pueden tener el mismo nombre.'); }
      }
      if (curso.length < 2) { m.push('Indica el nombre del profesor/a.'); }
      if (m.length) {
        $('hpk-err').innerHTML = m.map(esc).join('<br>');
        $('hpk-err').className = 'hpk-err hpk-ver';
        return;
      }
      datos = { alumno1: a1, alumno2: solo ? '' : a2, curso: curso };
      guardar('a1', a1); guardar('a2', solo ? '' : a2); guardar('curso', curso); guardar('solo', solo ? '1' : '0');
      enTexto(false);
      ov.parentNode.removeChild(ov);
      setTimeout(alAceptar, 0);
    }

    $('hpk-go').addEventListener('click', validar);
    ov.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT' && e.target.type === 'text') { validar(); }
    });
    setTimeout(function () { try { $('hpk-a1').focus(); } catch (e) {} }, 50);
  }

  /* ---------- Cálculo de aciertos (informativo) ---------- */
  function aciertos() {
    try {
      var D = window.DragEx;
      if (D && D.RightItems && D.GetLeftItemByOrigPos) {
        var tot = 0, ok = 0;
        D.RightItems.forEach(function (RI) {
          if (D.GetLeftItemByOrigPos(RI.OrigPos) !== null) {
            tot++;
            if (RI.MatchedWith !== -1) {
              var LI = D.GetLeftItemByOrigPos(RI.MatchedWith);
              if (LI && RI.Groups.indexOf(LI.Group) > -1) { ok++; }
            }
          }
        });
        return ok + '/' + tot;
      }
      if (window.State && window.QsToShow !== undefined) {
        var c = 0;
        for (var q = 0; q < window.State.length; q++) {
          if (window.State[q] != null && window.State[q][0] >= 1) { c++; }
        }
        return c + '/' + window.QsToShow;
      }
    } catch (e) {}
    return '';
  }

  /* ---------- Resultado y envío ---------- */
  function pintarResultado() {
    var r = resultado;
    var caja = $('hpk-res');
    if (!caja) {
      caja = document.createElement('div');
      caja.id = 'hpk-res';
      document.body.appendChild(caja);
    }
    caja.className = r.pasa ? 'hpk-res hpk-res-ok' : 'hpk-res hpk-res-mal';
    var equipo = esc(r.alumno1) + (r.alumno2 ? ' y ' + esc(r.alumno2) : ' (trabajo en solitario)');
    var msg;
    if (r.pasa) {
      msg = '✔ Actividad superada. Puedes repetirla si quieres subir nota.';
    } else {
      msg = '✘ Insuficiente: hay que llegar al ' + CFG.minimo + '%. Los datos NO se han enviado. Pulsa «Repetir actividad» para intentarlo de nuevo.';
    }
    caja.innerHTML = [
      '<button type="button" class="hpk-x" id="hpk-ocultar" aria-label="Ocultar resultado">✕</button>',
      '<div class="hpk-nota">' + r.pct + '%</div>',
      '<div class="hpk-cuerpo">',
      '<div class="hpk-equipo">' + equipo + ' · Prof: ' + esc(r.curso) + (r.aciertos ? ' · aciertos ' + esc(r.aciertos) : '') + '</div>',
      '<div class="hpk-msg">' + msg + '</div>',
      '<div id="hpk-estado" class="hpk-estado"></div>',
      '<div class="hpk-acciones">',
      '<button type="button" class="hpk-btn" id="hpk-repetir">Repetir actividad</button>',
      '<button type="button" class="hpk-btn hpk-btn-sec" id="hpk-reintento" style="display:none">Reintentar envío</button>',
      '</div></div>'
    ].join('');
    $('hpk-ocultar').addEventListener('click', function () { caja.style.display = 'none'; });
    $('hpk-repetir').addEventListener('click', function () { location.reload(); });
    $('hpk-reintento').addEventListener('click', function () { enviar(); });
  }

  function estado(clase, texto) {
    var e = $('hpk-estado');
    if (!e) { return; }
    e.className = 'hpk-estado ' + clase;
    e.textContent = texto;
  }

  var yaEnviado = false;
  function enviar() {
    if (!resultado || !resultado.pasa || yaEnviado) { return; }
    var re = $('hpk-reintento');
    if (re) { re.style.display = 'none'; }
    if (!CFG.url) {
      estado('hpk-aviso', '⚠ El envío a la hoja de cálculo no está configurado. Avisa a tu profesor/a.');
      return;
    }
    estado('hpk-aviso', 'Enviando resultados a la hoja de cálculo…');
    var ahora = new Date();
    var params = new URLSearchParams({
      id: resultado.id,
      fecha: ahora.toLocaleDateString('es-ES'),
      hora: ahora.toLocaleTimeString('es-ES', { hour12: false }),
      alumno1: resultado.alumno1,
      alumno2: resultado.alumno2,
      curso: resultado.curso,
      criterio: CFG.actividad,
      total: resultado.pct,
      prisma: '',
      bolsillo: '',
      tablas: '',
      test: resultado.pct,
      aciertos: resultado.aciertos,
      actividad: CFG.actividad,
      tipo: CFG.tipo
    });
    fetch(CFG.url, { method: 'POST', body: params })
      .then(function (resp) { return resp.json(); })
      .then(function (data) {
        if (!data.ok) { throw new Error(data.error || 'Respuesta no válida'); }
        yaEnviado = true;
        estado('hpk-bien', '✔ Resultados enviados correctamente a la hoja de cálculo.');
      })
      .catch(function () {
        /* Segundo intento sin leer la respuesta (el servidor ignora duplicados por id) */
        fetch(CFG.url, { method: 'POST', mode: 'no-cors', body: params })
          .then(function () {
            yaEnviado = true;
            estado('hpk-bien', '✔ Resultados enviados (no se pudo leer la confirmación del servidor).');
          })
          .catch(function () {
            estado('hpk-mal', '❌ No se pudieron enviar los resultados. Comprueba la conexión y pulsa «Reintentar envío».');
            var b = $('hpk-reintento');
            if (b) { b.style.display = 'inline-block'; }
          });
      });
  }

  function terminar() {
    var pct = Number(window.Score);
    if (isNaN(pct)) { pct = 0; }
    pct = Math.max(0, Math.min(100, Math.round(pct)));
    resultado = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
      alumno1: datos ? datos.alumno1 : '',
      alumno2: datos ? datos.alumno2 : '',
      curso: datos ? datos.curso : '',
      pct: pct,
      aciertos: aciertos(),
      pasa: pct >= CFG.minimo
    };
    pintarResultado();
    if (resultado.pasa) { enviar(); }
  }

  /* La actividad termina cuando Hot Potatoes marca Locked y Finished */
  function revisar() {
    if (enviado) { return; }
    if (window.Locked === true && window.Finished === true) {
      enviado = true;
      terminar();
    }
  }

  function envolver() {
    ['CheckFinished', 'CheckAnswers'].forEach(function (n) {
      var o = window[n];
      if (typeof o === 'function' && !o.__hpk) {
        var nueva = function () {
          var r = o.apply(this, arguments);
          try { revisar(); } catch (e) {}
          return r;
        };
        nueva.__hpk = true;
        window[n] = nueva;
      }
    });
  }
  envolver();

  window.HPK_iniciar = function (arranque) {
    envolver();
    ventanaDatos(function () {
      if (typeof arranque === 'function') { arranque(); }
    });
  };

  if (!CFG.onloadReescrito) {
    window.addEventListener('load', function () { window.HPK_iniciar(null); });
  }
})({"url":"https://script.google.com/macros/s/AKfycbyiOndS6GMYhgiSGLVAXUOOHhMKtBXqcLUeOppbNZIkrxU-HiMlgmhlYCj1xYZQG0io/exec","minimo":70,"tipo":"test","actividad":"Actividad Hot Potatoes","onloadReescrito":true});
</script>
<!-- HPK:fin -->
</head>
